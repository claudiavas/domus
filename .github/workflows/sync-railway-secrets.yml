name: Sync secrets to Railway

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set backend variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DOMUS }}
        run: |
          railway variables --service domus-backend \
            --set "BREVO_APIKEY=${{ secrets.BREVO_APIKEY_DOMUS }}" \
            --set "JWT_SECRET=${{ secrets.JWT_SECRET_DOMUS }}" \
            --set "MONGO_URL=${{ secrets.MONGO_URL_DOMUS }}" \
            --set "EMAIL_FROM=${{ secrets.EMAIL_FROM_DOMUS }}" \
            --skip-deploys
